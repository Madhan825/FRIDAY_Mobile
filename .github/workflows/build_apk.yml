name: Build FRIDAY v7 APK (ChatGPT UI + Live Voice + Always-On Offline AI)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Native Android ARM64 Offline LLM Engine (llama.cpp)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" --install "ndk;26.3.11579264"
            NDK_DIR="$SDK_ROOT/ndk/26.3.11579264"
          fi
          echo "Using Android NDK: $NDK_DIR"

          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama_cpp
          cmake -S /tmp/llama_cpp -B /tmp/llama_build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON

          cmake --build /tmp/llama_build --target llama-server -j$(nproc)
          BIN_PATH=$(find /tmp/llama_build -name "llama-server" -type f | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "Error: llama-server binary not produced"
            exit 1
          fi
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BIN_PATH" app/src/main/jniLibs/arm64-v8a/libfriday_llm.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libfriday_llm.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libfriday_llm.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compile FRIDAY v7 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload FRIDAY v7 APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-v7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
